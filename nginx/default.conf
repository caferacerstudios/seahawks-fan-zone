server {
  listen 80;
  listen [::]:80;

  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # Astro fingerprints compiled assets in /_astro/, so they are safe to cache forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Public assets keep stable names and must remain revalidatable after editorial updates.
  location ~* \.(?:avif|webp|png|jpe?g|gif|svg|css|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;

    # Never retain a missing static asset: it may be added by the next deploy.
    error_page 404 = @static_not_found;
  }

  location @static_not_found {
    add_header Cache-Control "no-store" always;
    return 404;
  }
}
