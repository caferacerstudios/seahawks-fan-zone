services:
  web:
    image: nginx:alpine
    container_name: seahawksfanzone-web
    ports:
      - "4322:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Snapshot state is independent of immutable site releases. Select the
      # dev or production host path with the operator-owned Compose env file.
      - ${TICKET_DATA_ROOT:-./runtime/tickets}:/srv/ticket-data:ro
    restart: unless-stopped

  ticket-sync:
    profiles: ["ticket-sync"]
    build:
      context: .
      dockerfile: deployment/ticket-sync/Dockerfile
    image: seahawksfanzone-ticket-sync:local
    env_file:
      - ${TICKET_SYNC_ENV_FILE:-deployment/ticket-sync/example.env}
    environment:
      TICKETS_OUTPUT_DIR: /srv/ticket-data/current
    volumes:
      - ${TICKET_DATA_ROOT:-./runtime/tickets}:/srv/ticket-data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
